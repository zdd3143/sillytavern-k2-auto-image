name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check extension syntax
        run: node --check extension/index.js

      - name: Validate workflow JSON
        run: |
          node -e "
            const fs = require('fs');
            const dir = 'comfyui';
            const files = [];
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).forEach(e => {
              const p = d + '/' + e.name;
              if (e.isDirectory()) walk(p);
              else if (e.name.endsWith('.json')) files.push(p);
            });
            walk(dir);
            for (const f of files) { JSON.parse(fs.readFileSync(f, 'utf8')); console.log('ok', f); }
            console.log('all workflow json ok:', files.length);
          "

      - name: Check for obvious secrets
        run: |
          if grep -RInE "sk-[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._-]{20,}" --exclude-dir=.git .; then
            echo "Potential secret found"
            exit 1
          fi
